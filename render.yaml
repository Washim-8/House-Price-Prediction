# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Render Blueprint — HouseIQ House Price Prediction                          ║
# ║  Project  : Flask 3 + scikit-learn (Random Forest) + Gunicorn               ║
# ║  Runtime  : Python 3.11  (set via .python-version)                          ║
# ║  Database : None (model is file-based — models/house_model.joblib)          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  - type: web
    name: house-price-prediction
    runtime: python
    plan: free                           # 0.1 CPU · 512 MB RAM · free tier

    # ── Build ─────────────────────────────────────────────────────────────────
    buildCommand: pip install -r requirements.txt

    # ── Start ─────────────────────────────────────────────────────────────────
    # • 2 workers × 4 threads  = 8 concurrent requests, fits 512 MB RAM
    # • --timeout 120          = gives the Random Forest predictor room to breathe
    # • $PORT                  = injected by Render at runtime
    startCommand: gunicorn app:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT --timeout 120

    # ── Health check ─────────────────────────────────────────────────────────
    # /health returns {"status":"healthy","ok":true} immediately — no model I/O
    healthCheckPath: /health

    # ── Environment variables ─────────────────────────────────────────────────
    envVars:
      # Python version pin (takes precedence over .python-version on Render)
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Disable Flask debug mode in production — REQUIRED
      - key: DEBUG
        value: "0"

      # Flask secret key — set sync:false so Render prompts you to enter it
      # manually in the Dashboard at deploy time. Never commit the real value.
      - key: SECRET_KEY
        generateValue: true              # Render generates a secure random value

      # Render automatically exposes RENDER_EXTERNAL_URL; the keep-alive thread
      # in app.py reads it to self-ping /health every 10 min (prevents free-tier
      # sleep). No action needed here — just documenting awareness.
